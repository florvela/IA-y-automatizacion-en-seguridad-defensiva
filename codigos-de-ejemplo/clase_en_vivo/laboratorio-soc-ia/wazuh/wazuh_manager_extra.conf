<!--
  Bloques extra que setup-wazuh.sh inyecta en el ossec.conf oficial del manager.
  Son los DOS puntos de conexión del lab:
-->

<ossec_config>

  <!-- 1) Recibir logs por syslog remoto (los manda la víctima por UDP 514). -->
  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>udp</protocol>
    <allowed-ips>172.20.0.0/16</allowed-ips>
  </remote>

  <!-- 2) Reglas que disparan este lab (PAM/sshd). Dedup por IP en el bridge = 1 ticket. -->
  <integration>
    <name>custom-soar</name>
    <hook_url>http://soc-worker:9100/webhook/wazuh</hook_url>
    <rule_id>5551,5712,5763</rule_id>
    <alert_format>json</alert_format>
  </integration>

</ossec_config>
