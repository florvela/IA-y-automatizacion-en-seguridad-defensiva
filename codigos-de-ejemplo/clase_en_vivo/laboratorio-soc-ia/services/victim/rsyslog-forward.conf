# 1) Reenvía los logs de autenticación al Wazuh manager por syslog UDP (perfil "siem").
#    Así Wazuh "ve" los intentos SSH sin instalar un agente completo.
authpriv.*  @wazuh.manager:514
auth.*      @wazuh.manager:514

# 2) Además los escribe a un archivo en volumen compartido, que lee siem-lite.
#    El MISMO log real alimenta a los dos detectores.
authpriv.*  /var/log/shared/auth.log
auth.*      /var/log/shared/auth.log
